[workspace]
resolver = "3"
members = [".", "crates/kes-core", "crates/kes-protocol", "firmware", "qualification", "third-party/kes-summed-ed25519"]
default-members = [".", "crates/kes-core", "crates/kes-protocol", "qualification"]
exclude = ["third-party/hpke"]

[package]
name = "pico2-kes-agent"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "pico2-kes-agentd"
path = "src/bin/pico2-kes-agentd.rs"

[[bin]]
name = "pico2-kes-agent-cli"
path = "src/bin/pico2-kes-agent-cli.rs"

[dependencies]
kes-core = { version = "=0.1.0", path = "crates/kes-core" }
kes-protocol = { version = "=0.1.0", path = "crates/kes-protocol" }
nusb = "=0.2.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rustix = { version = "=1.1.5", features = ["fs", "process", "event", "mm"] }
argon2 = "=0.5.3"
zeroize = "=1.8.2"
sha2 = "=0.10.9"

[dev-dependencies]
proptest = "=1.11.0"
criterion = "=0.8.2"
ed25519-dalek = "=2.2.0"
libc = "=0.2.191"

[[bench]]
name = "host"
path = "benches/host.rs"
harness = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[patch.crates-io]
hpke = { path = "third-party/hpke" }
